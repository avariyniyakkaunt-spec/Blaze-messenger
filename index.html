<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaze AI System</title>
    <style>
        :root { --blaze: #f5661b; --bg: #0a0a0a; --chat-bg: #1a1a1a; }
        
        body { 
            background: var(--bg); color: white; font-family: sans-serif;
            display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; 
        }

        /* Заголовок как на скрине */
        .header { 
            height: 60px; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #222; color: var(--blaze);
            text-transform: uppercase; letter-spacing: 3px; font-size: 14px; font-weight: bold;
        }

        /* Контейнер чата */
        #chat { 
            flex: 1; padding: 20px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 12px; 
        }

        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .bot { background: #222; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: var(--blaze); align-self: flex-end; border-bottom-right-radius: 4px; }

        /* Панель ввода */
        .footer { 
            padding: 15px; display: flex; align-items: center; gap: 10px;
            background: var(--bg); border-top: 1px solid #222;
        }

        input { 
            flex: 1; background: #1a1a1a; border: none; border-radius: 25px;
            padding: 12px 20px; color: white; outline: none; font-size: 15px;
        }

        .send-btn { 
            width: 50px; height: 50px; border-radius: 50%; background: var(--blaze);
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Иконка стрелочки */
        .send-btn::after {
            content: ''; width: 10px; height: 10px; border-right: 3px solid white;
            border-bottom: 3px solid white; transform: rotate(-45deg) translate(-2px, -2px);
        }
    </style>
</head>
<body>

<div class="header">Blaze AI System</div>
<div id="chat">
    <div class="msg bot">Привет! Я Blaze AI. О чем поболтаем?</div>
</div>

<div class="footer">
    <input type="text" id="userInput" placeholder="Напиши сообщение..." onkeypress="if(event.key==='Enter') send()">
    <button class="send-btn" onclick="send()"></button>
</div>

<script>
    const API_KEY = "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";

    async function send() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        addMsg(text, 'user');
        
        // Статус "думает"
        const thinkId = 't-' + Date.now();
        addMsg("Blaze анализирует...", 'bot', thinkId);

        try {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    "model": "owl-alpha",
                    "messages": [
                        {"role": "system", "content": "Ты Blaze AI, создан Дмитрием  и Айратом. Твой стиль: холодный, краткий, без эмодзи."},
                        {"role": "user", "content": text}
                    ]
                })
            });

            const data = await res.json();
            document.getElementById(thinkId).remove();

            if (data.choices) {
                const ans = data.choices[0].message.content;
                addMsg(ans, 'bot');
                speak(ans);
            }
        } catch (e) {
            document.getElementById(thinkId).innerText = "Ошибка связи.";
        }
    }

    function addMsg(text, type, id = '') {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if (id) div.id = id;
        div.innerText = text;
        const chat = document.getElementById('chat');
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
        // Очищаем очередь озвучки
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ru-RU';
        msg.pitch = 0.7; // Грубый, мужской голос
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
